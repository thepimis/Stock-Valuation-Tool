<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Valuation Tool - Overview</title><link rel="icon" href="logo.png"><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15181e;--inner:#20252e;--border:#303744;--text:#fff;--muted:#9da6b4;--green:#73be43;--red:#ff6464}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.container{max-width:1180px;margin:auto}.header{display:flex;align-items:center;gap:10px;justify-content:center}.header img{width:34px;height:34px}.header h1{font-size:1.55rem}.nav{display:flex;justify-content:center;gap:28px;border-bottom:1px solid var(--border);margin-bottom:14px}.nav a{color:var(--muted);text-decoration:none;font-weight:700;padding:11px 4px;border-bottom:2px solid transparent}.nav a.active{color:var(--text);border-bottom-color:var(--green)}.search{display:grid;grid-template-columns:1fr auto;gap:9px;background:var(--card);border:1px solid var(--border);padding:11px;border-radius:11px;margin-bottom:14px}.search input{background:var(--inner);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:7px;font-weight:700}.search button{background:var(--green);border:0;border-radius:7px;padding:10px 18px;font-weight:800}.status{color:var(--muted);min-height:20px;margin:0 2px 10px}.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}.hero{display:none}.hero.visible{display:block}.company{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.company h2{margin:0}.meta{color:var(--muted);margin-top:4px}.price{font-size:1.55rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:9px;margin-top:14px}.metric{background:var(--inner);border:1px solid var(--border);border-radius:9px;padding:10px}.metric small{display:block;color:var(--muted);text-transform:uppercase;font-size:.68rem;margin-bottom:5px}.metric strong{font-size:1rem}.sections{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}.section-title{margin:0 0 10px;font-size:1rem}.ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.note{color:var(--muted);line-height:1.55}.green{color:var(--green)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.sections{grid-template-columns:1fr}.ratio-grid{grid-template-columns:1fr 1fr}.nav{gap:12px;justify-content:space-between}.nav a{font-size:.78rem}.company{display:block}.price{margin-top:10px}}
</style></head><body><main class="container"><header class="header"><img src="logo.png" alt=""><h1>Stock Valuation Tool</h1></header><nav class="nav"><a class="active" href="index.html">Overview</a><a href="financial-history.html">Financial History</a><a href="calculator.html">Valuation Calculator</a></nav><div class="search"><input id="ticker" value="AAPL" placeholder="Search ticker"><button id="load">Search</button></div><div id="status" class="status"></div><section id="hero" class="hero"><div class="company"><div><h2 id="name"></h2><div id="meta" class="meta"></div></div><div id="price" class="price"></div></div><div id="metrics" class="grid"></div></section><div class="sections"><section class="card"><h3 class="section-title">Key ratios</h3><div id="ratios" class="ratio-grid"></div></section><section class="card"><h3 class="section-title">Growth and quality</h3><div id="quality" class="note"></div></section></div></main><script>
const WORKER='https://worker.jpuurins.workers.dev';const $=id=>document.getElementById(id);function n(v){const x=Number(v);return Number.isFinite(x)?x:null}function money(v){const x=n(v);if(x===null)return'-';const a=Math.abs(x);if(a>=1e12)return'$'+(x/1e12).toFixed(2)+'T';if(a>=1e9)return'$'+(x/1e9).toFixed(2)+'B';if(a>=1e6)return'$'+(x/1e6).toFixed(2)+'M';return'$'+x.toFixed(2)}function pct(v){const x=n(v);return x===null?'-':x.toFixed(2)+'%'}function metric(label,value){return `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}async function get(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function load(){const t=$('ticker').value.trim().toUpperCase();if(!t)return;$('status').textContent='Loading '+t+'...';$('hero').classList.remove('visible');try{const [snap,quote]=await Promise.all([get(`${WORKER}/data/${encodeURIComponent(t)}.json`),get(`${WORKER}?quote=${encodeURIComponent(t)}`)]);const c=snap.prepared?.company||{};const d=snap.prepared?.dashboard||{};const g=snap.prepared?.growth||{};$('name').textContent=quote.companyName||c.companyName||t;$('meta').textContent=`${t} · ${quote.exchangeLabel||c.exchange||''}`;$('price').textContent=money(quote.price||c.price);$('metrics').innerHTML=[metric('Market cap',money(c.marketCap)),metric('Enterprise value',money(c.enterpriseValue)),metric('Revenue TTM',money(c.revenueTtm)),metric('Net income TTM',money(c.netIncomeTtm)),metric('Free cash flow TTM',money(c.freeCashFlowTtm)),metric('Shares outstanding',n(c.sharesOutstanding)?.toFixed(2)+'B'),metric('ROIC',pct(c.roic)),metric('Total debt',money(c.totalDebt))].join('');const nm=d.netMargins||{},fm=d.fcfMargins||{},rg=d.revenueGrowth||{};$('ratios').innerHTML=[metric('Net margin',pct(nm.oneYear)),metric('FCF margin',pct(fm.oneYear)),metric('Revenue growth 1Y',pct(rg.oneYear)),metric('Revenue CAGR 5Y',pct(rg.fiveYears)),metric('Revenue CAGR 10Y',pct(rg.tenYears)),metric('ROIC',pct(c.roic))].join('');const growthMetrics=g.metrics||{};$('quality').innerHTML=`Latest prepared snapshot loaded from R2.<br><br><span class="green">Financial data:</span> ${c.asOf||snap.meta?.generatedAt||'available'}<br><span class="green">Snapshot schema:</span> ${snap.meta?.schemaVersion||'-'}<br><span class="green">Growth metrics:</span> ${Object.keys(growthMetrics).length||'available'}`;$('hero').classList.add('visible');$('status').textContent='';localStorage.setItem('svt:ticker',t)}catch(e){$('status').textContent='Could not load '+t+': '+e.message}}$('load').onclick=load;$('ticker').onkeydown=e=>{if(e.key==='Enter')load()};$('ticker').value=localStorage.getItem('svt:ticker')||'AAPL';load();
</script></body></html>
